<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UGC NET Paper 1 Practice Master</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); }
    
    /* Login Lock */
    #authOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95); display: flex; justify-content: center; align-items: center; z-index: 9999;
    }
    .auth-box { background: #fff; padding: 25px; border-radius: 10px; width: 90%; max-width: 380px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; background: var(--primary); color: #fff; font-weight: 600; cursor: pointer; }

    #app { display: none; }
    header { background: #fff; border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .dashboard { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 60px); }
    aside { background: #fff; border-right: 1px solid var(--border); padding: 15px; }
    .unit-btn { display: block; width: 100%; padding: 10px; border-radius: 6px; text-align: left; background: none; border: none; cursor: pointer; margin-bottom: 6px; font-size: 0.85rem; font-weight: 500; }
    .unit-btn.active { background: var(--primary); color: #fff; }
    main { padding: 20px; max-width: 850px; margin: 0 auto; width: 100%; }

    .q-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 16px; }
    .passage-box { background: #f1f5f9; padding: 12px; border-left: 4px solid var(--primary-light); margin-bottom: 12px; font-size: 0.9rem; line-height: 1.5; }
    .opt-label { display: flex; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; cursor: pointer; }
    .opt-label.correct { background: #dcfce7 !important; border-color: var(--success) !important; font-weight: 600; }
    .opt-label.wrong { background: #fee2e2 !important; border-color: var(--danger) !important; }
    .exp-box { background: #f0fdf4; border-left: 3px solid var(--success); padding: 10px; font-size: 0.85rem; margin-top: 10px; display: none; }
  </style>
</head>
<body>

  <!-- LOGIN DIALOG -->
  <div id="authOverlay">
    <div class="auth-box">
      <h3 style="margin-bottom: 15px;">Candidate Login</h3>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>ID</label>
          <input type="text" id="uid" required placeholder="Rakesh99">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="upass" required placeholder="Rakesh11">
        </div>
        <button type="submit" class="btn">Enter Exam Portal</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app">
    <header>
      <strong>UGC NET Paper 1 Engine</strong>
      <div>
        <span id="userBadge" style="margin-right: 15px; font-size: 0.85rem; font-weight: 600;"></span>
        <button onclick="toggleLang()" style="padding: 4px 8px; cursor: pointer;">Language: <span id="langTxt">English</span></button>
      </div>
    </header>

    <div class="dashboard">
      <aside>
        <div style="font-size: 0.75rem; text-transform: uppercase; color: #64748b; font-weight: 700; margin-bottom: 10px;">Select Unit</div>
        <div id="unitButtons"></div>
      </aside>

      <main>
        <h3 id="currentUnitTitle" style="margin-bottom: 5px;">Unit 1</h3>
        <p id="progressInfo" style="font-size: 0.8rem; color: #64748b; margin-bottom: 15px;">Loading questions...</p>

        <form id="quizForm" onsubmit="submitAnswers(event)">
          <div id="questionsContainer"></div>
          <button type="submit" id="btnSubmit" class="btn" style="margin-top: 10px;">Submit Set (5 Questions)</button>
          <button type="button" id="btnNext" class="btn" style="display: none; margin-top: 10px;" onclick="loadSet()">Next 5 Questions →</button>
        </form>
      </main>
    </div>
  </div>

  <script>
    let questionDatabase = {};
    let activeUnit = 1;
    let currentSet = [];
    let currentLang = 'en';
    let currentUser = null;

    // Load External Question Data
    async function loadData() {
      try {
        const res = await fetch('questions.json');
        questionDatabase = await res.json();
      } catch (e) {
        console.error("questions.json file nahi mili! Make sure dono file ek sath hain.", e);
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('uid').value.trim();
      const p = document.getElementById('upass').value.trim();
      if ((u === 'Rakesh99' && p === 'Rakesh11') || u.length > 2) {
        currentUser = u;
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('userBadge').innerText = "Logged in: " + u;
        buildSidebar();
        loadSet();
      } else {
        alert("Invalid ID or Password");
      }
    }

    function buildSidebar() {
      const container = document.getElementById('unitButtons');
      container.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        const btn = document.createElement('button');
        btn.className = `unit-btn ${i === activeUnit ? 'active' : ''}`;
        btn.innerText = `Unit ${i}`;
        btn.onclick = () => {
          activeUnit = i;
          document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          loadSet();
        };
        container.appendChild(btn);
      }
    }

    function getAttemptedIds() {
      const history = JSON.parse(localStorage.getItem('user_history_' + currentUser) || '[]');
      return new Set(history.map(h => h.id));
    }

    function loadSet() {
      const unitPool = questionDatabase[activeUnit] || [];
      const attempted = getAttemptedIds();
      
      // Strict Filter: Unattempted only (Zero Repetition)
      const available = unitPool.filter(q => !attempted.has(q.id));

      if (available.length === 0 && unitPool.length > 0) {
        alert("Is Unit ke saare questions aap attempt kar chuke hain!");
        currentSet = unitPool.slice(0, 5);
      } else {
        currentSet = available.slice(0, 5);
      }

      document.getElementById('currentUnitTitle').innerText = `Unit ${activeUnit}`;
      document.getElementById('progressInfo').innerText = `Attempted: ${attempted.size} / Available: ${unitPool.length}`;

      renderQuestions();
      document.getElementById('btnSubmit').style.display = 'block';
      document.getElementById('btnNext').style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderQuestions() {
      const box = document.getElementById('questionsContainer');
      box.innerHTML = '';

      if (currentSet.length === 0) {
        box.innerHTML = '<p style="color:red;">Is Unit mein abhi questions add nahi hue hain `questions.json` mein.</p>';
        document.getElementById('btnSubmit').style.display = 'none';
        return;
      }

      currentSet.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        // Unit 3: Passage Display
        let passageHtml = '';
        if (q.passage_en) {
          passageHtml = `<div class="passage-box"><strong>Passage / गद्यांश:</strong><br>${currentLang === 'en' ? q.passage_en : q.passage_hi}</div>`;
        }

        // Unit 7: DI Table Display
        let tableHtml = q.table_html ? q.table_html : '';

        const qText = currentLang === 'en' ? q.q_en : q.q_hi;
        const opts = currentLang === 'en' ? q.options_en : q.options_hi;

        card.innerHTML = `
          ${passageHtml}
          ${tableHtml}
          <div style="font-weight:600; margin-bottom:12px;">Q${idx + 1}. ${qText}</div>
          <div class="opts-list">
            ${opts.map((opt, oIdx) => `
              <label class="opt-label" id="label_${idx}_${oIdx}">
                <input type="radio" name="q_${idx}" value="${oIdx}" required style="margin-right:10px;">
                <span>${opt}</span>
              </label>
            `).join('')}
          </div>
          <div class="exp-box" id="exp_${idx}"><strong>Explanation:</strong> ${q.exp}</div>
        `;
        box.appendChild(card);
      });
    }

    function submitAnswers(e) {
      e.preventDefault();
      const history = JSON.parse(localStorage.getItem('user_history_' + currentUser) || '[]');

      currentSet.forEach((q, idx) => {
        const chosen = document.querySelector(`input[name="q_${idx}"]:checked`);
        const val = chosen ? parseInt(chosen.value) : -1;
        const isCorrect = (val === q.ans);

        // Color coding
        document.querySelectorAll(`input[name="q_${idx}"]`).forEach((r, oIdx) => {
          r.disabled = true;
          const lbl = document.getElementById(`label_${idx}_${oIdx}`);
          if (oIdx === q.ans) lbl.classList.add('correct');
          else if (oIdx === val && !isCorrect) lbl.classList.add('wrong');
        });

        document.getElementById(`exp_${idx}`).style.display = 'block';

        history.push({ id: q.id, unit: activeUnit, correct: isCorrect });
      });

      localStorage.setItem('user_history_' + currentUser, JSON.stringify(history));
      document.getElementById('btnSubmit').style.display = 'none';
      document.getElementById('btnNext').style.display = 'block';
    }

    function toggleLang() {
      currentLang = currentLang === 'en' ? 'hi' : 'en';
      document.getElementById('langTxt').innerText = currentLang === 'en' ? 'English' : 'Hindi';
      renderQuestions();
    }

    window.onload = loadData;
  </script>
</body>
</html>
